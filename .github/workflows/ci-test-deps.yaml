# Dependency compatibility testing workflow.
# Tests the package with different versions of both its required and optional
# dependencies. The set of packages tested is driven entirely by the keys of
# dev/config/package_versions.json (kept up to date by
# bot-generate-package-versions.yaml), not by pyproject.toml's
# [project.optional-dependencies] - unlike coola, most of the packages tested
# here are core, required dependencies rather than optional extras, so a
# single matrix job over lib-get-package-versions.yaml's package_names output
# covers both required and optional dependencies without hardcoding either.

name: Dependency Compatibility (Source)
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Get dependency version information from config file
  get-versions:
    uses: ./.github/workflows/lib-get-package-versions.yaml

  # One job per package in dev/config/package_versions.json, driven by
  # get-versions instead of a hardcoded list, so a new dependency only needs
  # to be added to that config file.
  test-dep:
    needs: get-versions
    strategy:
      fail-fast: false
      matrix:
        package-name: ${{ fromJson(needs.get-versions.outputs.package_names) }}
    uses: ./.github/workflows/ci-test-code-dep.yaml
    with:
      package-name: ${{ matrix.package-name }}
      package-versions: ${{ toJson(fromJson(needs.get-versions.outputs.package_versions)[matrix.package-name]) }}
      test-matrix: ${{ inputs.test-matrix }}
