name: Get Package Versions

# This reusable workflow reads package version configuration from a JSON file
# and exposes it as an output for use in other workflows.
#
# Usage:
#   jobs:
#     get-versions:
#       uses: ./.github/workflows/lib-get-package-versions.yaml
#
#     use-versions:
#       needs: get-versions
#       runs-on: ubuntu-latest
#       steps:
#         - name: Use versions
#           run: echo "${{ needs.get-versions.outputs.package_versions }}"

on:
  workflow_call:
    outputs:
      package_versions:
        description: "JSON string containing all package versions from dev/config/package_versions.json"
        value: ${{ jobs.get-versions.outputs.package_versions }}
      package_names:
        description: "JSON array of the top-level keys (package names) in dev/config/package_versions.json"
        value: ${{ jobs.get-versions.outputs.package_names }}

  workflow_dispatch: # Allows manual triggering for testing purposes

permissions:
  contents: read

jobs:
  get-versions:
    runs-on: ubuntu-slim
    timeout-minutes: 2
    outputs:
      package_versions: ${{ steps.read-json.outputs.json-content }}
      package_names: ${{ steps.names.outputs.package_names }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Read and validate JSON file
        uses: durandtibo/read-json-action@b014656c6f0c53b3caf9056fedeaead02ebae3ad # ratchet:durandtibo/read-json-action@v0.1
        id: read-json
        with:
          file-path: dev/config/package_versions.json

      - name: Display package versions
        env:
          JSON_CONTENT: ${{ steps.read-json.outputs.json-content }}
        run: |
          echo "📦 Package versions loaded successfully:"
          echo "$JSON_CONTENT" | jq '.'

      - name: Extract package names
        id: names
        env:
          JSON_CONTENT: ${{ steps.read-json.outputs.json-content }}
        run: |
          echo "package_names=$(echo "$JSON_CONTENT" | jq -c '[keys[]]')" >> "$GITHUB_OUTPUT"
