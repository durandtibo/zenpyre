name: Test Package with Extras
on:
  workflow_call:
    inputs:
      install-args:
        default: ""
        description: "Optional arguments to install the package"
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.14", "3.13", "3.12", "3.11", "3.10"]
        extra:
          [
            "all",
            "anthropic",
            "chroma",
            "duckdb",
            "faker",
            "google-genai",
            "huggingface",
            "ollama",
            "openai",
            "polars",
            "sentence-transformers",
            "text-splitters",
          ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # ratchet:astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      - name: Install package
        run: |
          uv pip install ${{ inputs.install-args }} "zenpyre[${{ matrix.extra }}]"

      - name: Show dependency tree
        run: |
          uv pip tree --show-version-specifiers

      - name: Run some checks
        run: |
          python tests/package_checks.py
